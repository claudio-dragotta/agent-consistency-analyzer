# Docker Compose for Agent 2 — Core Services
# Solo i servizi effettivamente utilizzati nel flusso interattivo (n8n → API REST)
#
# Per aggiungere anche Kafka (pipeline automatica Agent1 → Agent2 → Agent3):
#   docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d --build

x-common-env: &common-env
  # Ollama Configuration
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:14b}
  OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-180}

  # Application Configuration
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  API_HOST: 0.0.0.0
  API_PORT: 8002

  # Analysis Settings
  EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-all-MiniLM-L6-v2}
  ENTITY_OVERLAP_THRESHOLD: ${ENTITY_OVERLAP_THRESHOLD:-0.85}
  SEMANTIC_SIMILARITY_THRESHOLD: ${SEMANTIC_SIMILARITY_THRESHOLD:-0.75}
  MAX_FOLLOW_UP_QUESTIONS: ${MAX_FOLLOW_UP_QUESTIONS:-5}

services:
  # Agent 2 - REST API Mode
  agent2-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent2-consistency-analyzer:latest
    container_name: agent2-api
    ports:
      - "${API_PORT:-8002}:8002"
    environment:
      <<: *common-env
    volumes:
      - ./knowledge_base:/app/knowledge_base:ro
      - ./input_agent:/app/input_agent:ro
      - ./output_agent:/app/output_agent
      - agent2_logs:/app/logs
    networks:
      - agent2-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # N8N - Workflow Orchestration
  n8n:
    image: n8nio/n8n:latest
    container_name: agent2-n8n
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - GENERIC_TIMEZONE=Europe/Rome
      - AGENT2_API_URL=http://agent2-api:8002
      - N8N_PUBLIC_API_DISABLED=false
      - N8N_PUBLIC_API_KEY=agent2-api-key-12345
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - agent2-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  agent2-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  agent2_logs:
    driver: local
  n8n_data:
    driver: local
